services:
  clawdbot-gateway:
    image: clawdbot-gateway:2026.10.8  # 回滚改回 clawdbot-gateway:rollback-20261028，并恢复配置备份（UPGRADE_PLAN_2026-10-28.md 阶段 6）
    container_name: clawdbot-gateway
    restart: unless-stopped
    volumes:
      - /home/zhongzishi/.clawdbot:/home/node/.openclaw
      - /mnt/data_ssd/chocos:/home/node/chocos
      - /mnt/data_ssd/tianhui:/home/node/tianhui
      - /mnt/data_ssd/clawdbot-workspace:/home/node/workspace  # main agent workspace 持久化（防 recreate 丢失）
      - /home/zhongzishi/.ssh:/home/node/.ssh:ro
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "3456:18789"
    environment:
      - HOME=/home/node
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
