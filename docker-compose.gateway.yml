services:
  clawdbot-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: clawdbot-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/.clawdbot:/root/.clawdbot
      - ~/.claude:/root/.claude
      - ~/clawd:/root/clawd
      - ~/.clawdbot/tools:/tools
      - /mnt/data_ssd/clawdbot/extensions:/app/extensions
      - /mnt/data_ssd/clawdbot/dist:/app/dist
    env_file:
      - ~/.clawdbot/.env
    environment:
      - HOME=/root
      - OPENCLAW_STATE_DIR=/root/.clawdbot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
